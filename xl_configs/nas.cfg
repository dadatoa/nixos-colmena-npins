name = "nas"
type = "pvh"
memory = 4096
vcpus = 2
vif = [ "bridge=xenbr50,mac=02:b0:9a:91:34:40" ]
on_poweroff = "destroy"
on_reboot = "restart"
on_crash = "restart"
disk = [ "/dev/sys/nas,,xvda", "/dev/rust/media,,xvdb", "/dev/nvme_vg/appdata,,xvdc"  ]
kernel="/run/current-system/sw/lib/grub-xen_pvh/grub-i386-xen_pvh.bin"
