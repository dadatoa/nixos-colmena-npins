name: deploy nixos on DomUs

on:
  workflow_dispatch:

jobs:
  unseal-openbao:
    uses: ./.github/workflows/unseal-openbao.yml
    secrets: inherit

  deploy-nixos:
    needs: unseal-openbao
    runs-on: ubuntu-latest

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v6
      - name: "install nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - run: nix-env -i colmena -f '<nixpkgs>'
      - name: "install bao CLI"
        run: nix-env -i openbao -f '<nixpkgs>'
      - name: "Tailscale"
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd
          ping: xen.${{ secrets.TS_TAILNET }}
      - name: "Configure SSH"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/external-machine.key
          chmod 600 ~/.ssh/external-machine.key
          cat >>~/.ssh/config <<END
          Host *
            User $SSH_USER
            IdentityFile ~/.ssh/external-machine.key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          END

      - name: "Login to OpenBao (colmena-app AppRole)"
        env:
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          BAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          COLOMENA_APP_ROLE_ID: ${{ secrets.COLOMENA_APP_ROLE_ID }}
          COLOMENA_APP_SECRET_ID: ${{ secrets.COLOMENA_APP_SECRET_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(bao write -format=json auth/approle/login \
            role_id="$COLOMENA_APP_ROLE_ID" secret_id="$COLOMENA_APP_SECRET_ID" \
            | jq -er '.auth.client_token')

          echo "BAO_ADDR=$BAO_ADDR" >> "$GITHUB_ENV"
          echo "OPENBAO_ADDR=$OPENBAO_ADDR" >> "$GITHUB_ENV"
          echo "BAO_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "OPENBAO_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: "deployment to vms"
        run: colmena apply -f colmena/hive.nix --reboot --on @domu
