name: deploy nixos configurations

on:
  workflow_dispatch:
    inputs:
      reboot-dom0:
        description: "also reboot xen (dom0) if its kernel changed (restarts the running domUs)"
        type: boolean
        required: false
        default: false

# Deployment targets, keep in sync with deployment.targetHost in colmena/hive.nix
env:
  HOST_DOM0: 100.85.206.102
  HOST_DOMU: 100.75.154.28

jobs:
  unseal-openbao:
    uses: ./.github/workflows/unseal-openbao.yml
    secrets: inherit

  deploy-nixos:
    needs: unseal-openbao
    runs-on: ubuntu-latest

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v7
      - name: "install nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - run: nix-env -i colmena -f '<nixpkgs>'
      - name: "install bao CLI"
        run: nix-env -i openbao -f '<nixpkgs>'
      - name: "Tailscale"
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd
          ping: xen.${{ secrets.TS_TAILNET }}
      - name: "Configure SSH"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/external-machine.key
          chmod 600 ~/.ssh/external-machine.key
          cat >>~/.ssh/config <<END
          Host *
            User $SSH_USER
            IdentityFile ~/.ssh/external-machine.key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          END

      - name: "Login to OpenBao (colmena-app AppRole)"
        env:
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          BAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          COLMENA_APP_ROLE_ID: ${{ secrets.COLMENA_APP_ROLE_ID }}
          COLMENA_APP_SECRET_ID: ${{ secrets.COLMENA_APP_SECRET_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(bao write -format=json auth/approle/login \
            role_id="$COLMENA_APP_ROLE_ID" secret_id="$COLMENA_APP_SECRET_ID" \
            | jq -er '.auth.client_token')

          echo "BAO_ADDR=$BAO_ADDR" >> "$GITHUB_ENV"
          echo "OPENBAO_ADDR=$OPENBAO_ADDR" >> "$GITHUB_ENV"
          echo "BAO_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "OPENBAO_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: "deploy"
        run: colmena apply switch -f colmena/hive.nix

      # The switch above only activates the new userland: the old kernel keeps
      # running until the node is rebooted, so reboot when the kernel changed.
      - name: "reboot @domu if needed"
        run: .github/scripts/reboot-if-needed.sh nas "$HOST_DOMU"

      # Rebooting dom0 also destroys and restarts every domU, so it stays opt-in.
      - name: "reboot @dom0 if needed"
        if: ${{ inputs.reboot-dom0 }}
        run: .github/scripts/reboot-if-needed.sh xen "$HOST_DOM0"
